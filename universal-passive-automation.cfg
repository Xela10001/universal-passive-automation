-- /home/universal-passive-automation.cfg, one per group computer.
-- name:   dashboard title, e.g. "DTPF" or "Fusion Reactor".
-- poll:   seconds between checks.
-- key:    fluid = OC fluid name ("molten.infinity"), item = "name:damage". Find them with: universal-passive-automation dump <text>
-- weight: desired stock ratio. Lowest stock/weight runs. Infinity 10 + Spacetime 1 = keep 10x more Infinity.
-- cap:    optional. Stop making it at this amount (L for fluids). No cap = always a candidate.
-- freq:   WR-CBE frequency of the receiver on this recipe's toggle bus.
-- need:   ingredient key -> minimum stock before this recipe may be selected.
-- Amounts (weight, cap, need) may be numbers (150e6) or quoted strings with K/M/B/T: "150M", "1.5B".
return {
  name = "DTPF",
  poll = 60,
  products = {
    {key = "molten.infinity", weight = 10, cap = "150M", freq = 1001,
      need = {
		  ["Avaritia:Resource:5"] = "10k",
		  ["gregtech:gt.comb:119"] = "10k",
		  ["exciteddtec"] = "5M"
	  }},
    {key = "molten.spacetime", weight = 1, freq = 1002,
      need = {["PLASMA_T4_KEY"] = "10M"}},
    {key = "molten.hypogen", weight = 1, freq = 1003,
      need = {}},
  },
}
