      ["gregtech:gt.metaitem.01:32417"] = ITEM, -- Energised Tesseract
      [DTR] = FLUID, ["molten.infinity"] = FLUID}},

    -- Superconductor Base UMV
    {key = "molten.superconductorumvbase", weight = 1, cap = FLUID_CAP, freq = 1016, need = {
      ["molten.spacetime"] = FLUID, ["molten.orundum"] = FLUID, ["molten.hypogen"] = FLUID,
      ["molten.titansteel"] = FLUID, ["molten.dragonblood"] = FLUID, ["plasma.oxygen"] = FLUID,
      [EXOTIC] = FLUID}},

    -- Shirabon (no catalyst)
    {key = "molten.shirabon", weight = 1, cap = FLUID_CAP, freq = 1017, need = {
      ["molten.metastable oganesson"] = FLUID,  -- verify
      ["molten.precious metals alloy"] = FLUID, -- verify
      ["molten.spacetime"] = FLUID, [DTR] = FLUID}},

    -- Quantum (also outputs Blocks of Astral Titanium)
    {key = "molten.quantum", weight = 1, cap = FLUID_CAP, freq = 1018, need = {
      ["dreamcraft:Quantinum:0"] = ITEM, -- Quantinum block (verify)
      [QA] = ITEM,
      ["molten.blacktitanium"] = FLUID, ["molten.americium"] = FLUID, ["molten.bismuth"] = FLUID,
      ["molten.hypogen"] = FLUID, ["plasma.titanium"] = FLUID,
      [EXOTIC] = FLUID}},

    -- Dimensionally Shifted Superfluid
    {key = "dimensionallyshiftedsuperfluid", weight = 1, cap = FLUID_CAP, freq = 1019, need = {
      ["stablebaryonicmatter"] = FLUID, ["molten.metastable oganesson"] = FLUID, -- verify
      ["grade8purifiedwater"] = FLUID, ["plasma.celestialtungsten"] = FLUID,  -- verify
      ["heavyradox"] = FLUID,
      [EXOTIC] = FLUID}},

    -- Six-Phased Copper (no catalyst)
    {key = "molten.sixphasedcopper", weight = 1, cap = FLUID_CAP, freq = 1020, need = {
      ["Avaritia:Singularity:5"] = ITEM, -- Copper Singularity
      ["molten.celestialtungsten"] = FLUID, ["molten.astraltitanium"] = FLUID,
      ["molten.hypogen"] = FLUID, ["molten.chromaticglass"] = FLUID,
      ["molten.rhugnor"] = FLUID, ["molten.mellion"] = FLUID}},

    -- Dark Matter block (Amun-Ra)
    {key = "GalacticraftAmunRa:tile.baseBlockRock:14", weight = 1, cap = ITEM_CAP, freq = 1021, need = {
      ["gregtech:gt.blockmetal9:4"] = ITEM, -- Block of Transcendent Metal
      ["Avaritia:Resource:8"] = ITEM,       -- Star Fuel
      ["molten.cosmicneutronium"] = FLUID, ["molten.tairitsu"] = FLUID,
      ["molten.celestialtungsten"] = FLUID,
      [EXOTIC] = FLUID}},
  },
}
