-- /home/universal-passive-automation.cfg, one per group computer.
-- name:   dashboard title, e.g. "DTPF" or "Fusion Reactor".
-- poll:   seconds between checks.
-- key:    fluid = OC fluid name ("molten.infinity"), item = "name:damage". Find them with: upa dump <text>
-- weight: desired stock ratio. Lowest stock/weight runs. Weight 10 vs 1 = keep 10x more of the first.
-- cap:    optional. Stop making it at this amount (L for fluids). No cap = always a candidate.
-- freq:   WR-CBE frequency of the receiver on this recipe's toggle bus. Must be unique.
-- need:   ingredient key -> minimum stock before this recipe may be selected.
-- Amounts may be numbers (150e6) or quoted strings with K/M/B/T: "150M", "1.5B".
--
-- Default DTPF config: every DTPF product, using its best recipe below Stellar catalyst
-- (Exotic where one exists). Products whose only recipe needs Stellar are left out
-- (Transcendent Metal, Timepiece, Space/Time conversion, Chipped Amalgatite).
-- Non-consumed inputs (circuits, Compressed Fusion Reactor, HiC T5, lenses, Energy Core)
-- are not in `need`: keep them permanently in the machine.
-- Delete the products you don't build: a product without a receiver idles the DTPFs when picked.
-- Keys marked "verify" come from source code but weren't checked in game: run `upa dump <name>`.



