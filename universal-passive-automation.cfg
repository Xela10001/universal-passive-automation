-- /home/universal-passive-automation.cfg, one per group computer.
-- name:   dashboard title, e.g. "DTPF" or "Fusion Reactor".
-- poll:   seconds between checks.
-- key:    fluid = OC fluid name ("molten.infinity"), item = "name:damage". Find them with: upa dump <text>
-- weight: desired stock ratio. Lowest stock/weight runs. Weight 10 vs 1 = keep 10x more of the first.
-- cap:    optional. Stop making it at this amount (L for fluids). No cap = always a candidate.
-- freq:   WR-CBE frequency of the receiver on this recipe's toggle bus. Must be unique.
-- need:   ingredient key -> minimum stock before this recipe may be selected.
-- Amounts may be numbers (150e6) or quoted strings with K/M/B/T: "150M", "1.5B".
--
-- Default DTPF config: every DTPF product, using its best recipe below Stellar catalyst
-- (Exotic where one exists). Products whose only recipe needs Stellar are left out
-- (Transcendent Metal, Timepiece, Space/Time conversion, Chipped Amalgatite).
-- Non-consumed inputs (circuits, Compressed Fusion Reactor, HiC T5, lenses, Energy Core)
-- are not in `need`: keep them permanently in the machine.
-- Delete the products you don't build: a product without a receiver idles the DTPFs when picked.
-- Keys marked "verify" come from source code but weren't checked in game: run `upa dump <name>`.

local EXOTIC = "exciteddtec"   -- Excited Exotic (tier 4) catalyst
local DTR = "dimensionallytranscendentresidue"
local QA = "miscutils:MU-metaitem.01:32105" -- Quantum Anomaly
local ITEM, FLUID = "10k", "1M"             -- minimum ingredient stock
local ITEM_CAP, FLUID_CAP = "10k", "10M"

return {
  name = "DTPF",
  poll = 60,
  products = {
    -- Quantum Anomaly (multiplication recipe: 1 anomaly -> 4). Needs only 1 anomaly to
    -- start; a 10k minimum would be above its own cap and it could never run.
    {key = QA, weight = 1, cap = ITEM_CAP, freq = 1001, need = {
      [QA] = 1,
      ["gregtech:gt.metaitem.03:32303"] = ITEM, -- Stable Boson Containment Unit
      ["molten.tritanium"] = FLUID,
      [EXOTIC] = FLUID}},

    -- Superconductor Base LuV
    {key = "molten.tetraindiumditindibariumtitaniumheptacoppertetrakaidekaoxid", weight = 1, cap = FLUID_CAP, freq = 1002, need = {
      ["molten.indium"] = FLUID, ["molten.tin"] = FLUID, ["molten.barium"] = FLUID,
      ["molten.titanium"] = FLUID, ["molten.copper"] = FLUID, ["plasma.oxygen"] = FLUID,
      [EXOTIC] = FLUID}},

    -- Superconductor Base ZPM
    {key = "molten.tetranaquadahdiindiumhexaplatiumosminid", weight = 1, cap = FLUID_CAP, freq = 1003, need = {
      ["molten.palladium"] = FLUID, ["molten.indium"] = FLUID, ["molten.osmium"] = FLUID,
      ["molten.naquadah"] = FLUID,
      [EXOTIC] = FLUID}},

    -- Superconductor Base UV
    {key = "molten.longasssuperconductornameforuvwire", weight = 1, cap = FLUID_CAP, freq = 1004, need = {
      ["molten.samarium"] = FLUID, ["molten.europium"] = FLUID, ["molten.osmiridium"] = FLUID,
      ["molten.naquadria"] = FLUID,
      [EXOTIC] = FLUID}},

    -- Bedrockium
    {key = "molten.bedrockium", weight = 1, cap = FLUID_CAP, freq = 1005, need = {
      ["molten.steel"] = FLUID,
      [EXOTIC] = FLUID}},

    -- Chromatic Glass
    {key = "molten.chromaticglass", weight = 1, cap = FLUID_CAP, freq = 1006, need = {
      ["molten.glass"] = FLUID,
      [EXOTIC] = FLUID}},

    -- Neutronium
    {key = "molten.neutronium", weight = 1, cap = FLUID_CAP, freq = 1007, need = {
      ["molten.iron"] = FLUID,
      [EXOTIC] = FLUID}},

    -- Cosmic Neutronium (plain recipe, programmed circuit 4; comb recipe not used)
    {key = "molten.cosmicneutronium", weight = 1, cap = FLUID_CAP, freq = 1008, need = {
      ["molten.copper"] = FLUID,
      [EXOTIC] = FLUID}},

    -- Infinity (plain recipe, programmed circuit 4; comb recipe not used)
    {key = "molten.infinity", weight = 1, cap = FLUID_CAP, freq = 1009, need = {
      ["Avaritia:Resource:5"] = ITEM, -- Infinity Catalyst
      [EXOTIC] = FLUID}},

    -- Superconductor Base UHV
    {key = "molten.longasssuperconductornameforuhvwire", weight = 1, cap = FLUID_CAP, freq = 1010, need = {
      ["molten.draconium"] = FLUID, ["molten.americium"] = FLUID,
      ["molten.cosmicneutronium"] = FLUID, ["molten.tritanium"] = FLUID,
      [EXOTIC] = FLUID}},

    -- Hypogen (Compressed Fusion Reactor recipe)
    {key = "molten.hypogen", weight = 1, cap = FLUID_CAP, freq = 1011, need = {
      ["molten.neutronium"] = FLUID, ["molten.quantum"] = FLUID, ["molten.infinity"] = FLUID,
      [EXOTIC] = FLUID}},

    -- Raw Tesseract
    {key = "gregtech:gt.metaitem.01:32415", weight = 1, cap = ITEM_CAP, freq = 1012, need = {
      ["gregtech:gt.metaitem.01:23982"] = ITEM,          -- Cosmic Neutronium Rod
      ["bartworks:gt.bwMetaGeneratedstick:10106"] = ITEM, -- Tairitsu Rod (verify)
      ["gregtech:gt.metaitem.01:23581"] = ITEM,          -- Transcendent Metal Rod
      ["miscutils:itemPlateBotmium:0"] = ITEM,           -- verify
      ["miscutils:itemScrewArcanite:0"] = ITEM,          -- verify
      ["supersolarpanel:enderquantumcomponent:0"] = ITEM, -- verify
      [EXOTIC] = FLUID}},

    -- Superconductor Base UEV
    {key = "molten.superconductoruevbase", weight = 1, cap = FLUID_CAP, freq = 1013, need = {
      ["molten.advancednitinol"] = FLUID, ["molten.celestialtungsten"] = FLUID,
      ["molten.draconiumawakened"] = FLUID, ["molten.infinity"] = FLUID, ["plasma.iron"] = FLUID,
      [EXOTIC] = FLUID}},

    -- Superconductor Base UIV
    {key = "molten.superconductoruivbase", weight = 1, cap = FLUID_CAP, freq = 1014, need = {
      ["molten.radoxpoly"] = FLUID, ["molten.transcendentmetal"] = FLUID, ["molten.rhugnor"] = FLUID,
